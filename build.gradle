plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // 本地补丁仓库：补齐官方 CDN 镜像缺失的纯 POM 模块（minecraft-dependencies）
    maven {
        name = 'LocalMaven'
        url = uri("${rootDir}/local-maven")
    }
    // NeoForged 官方 CDN 镜像，国内可直连
    maven {
        name = 'NeoForged'
        url = 'https://neoforged.forgecdn.net/releases'
    }
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
    }
    maven {
        name = 'Parchment'
        url = 'https://maven.parchmentmc.org'
    }
    mavenCentral()
}

// 用户名含非 ASCII 字符时，开发启动早期窗口无法从 Gradle 缓存解析 LWJGL 原生库。
// 这里把 natives jar 里的 DLL 解到纯 ASCII 的 build/natives 并显式指定查找路径。
def nativesDir = layout.buildDirectory.dir("natives")
def prepareNatives = tasks.register("prepareNatives") {
    outputs.dir(nativesDir)
    doLast {
        def out = nativesDir.get().asFile
        out.mkdirs()
        def cache = new File(System.getProperty("user.home"), ".gradle/caches/neoformruntime/artifacts/org/lwjgl")
        if (!cache.isDirectory()) {
            logger.warn("未找到 LWJGL natives 缓存: ${cache}")
            return
        }
        def count = 0
        cache.eachFileRecurse { File jar ->
            if (!jar.name.endsWith("-natives-windows.jar")) return
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.isDirectory() || !entry.name.endsWith(".dll")) continue
                    def name = new File(entry.name).name
                    def flat = new File(out, name)
                    def nested = new File(out, "windows/x64/org/lwjgl/" + name)
                    nested.parentFile.mkdirs()
                    zip.getInputStream(entry).withCloseable { input ->
                        flat.bytes = input.bytes
                    }
                    nested.bytes = flat.bytes
                    count++
                }
            }
        }
        logger.lifecycle("已准备 ${count} 个 LWJGL 原生库 -> ${out}")
    }
}
tasks.matching { it.name.startsWith("run") }.configureEach { dependsOn prepareNatives }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            def lwjglCache = new File(System.getProperty("user.home"), ".gradle/caches/neoformruntime/artifacts/org/lwjgl")
            if (lwjglCache.isDirectory()) {
                systemProperty 'org.lwjgl.librarypath', nativesDir.get().asFile.absolutePath
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// AE2 为可选依赖：编译期需要其 API，运行期由 runClient 加载但 mods.toml 中不强制要求
dependencies {
    compileOnly files("libs/appliedenergistics2-19.2.19.jar", "libs/Mekanism-1.21.1-10.7.19.85.jar")
    // -PwithoutAe2 / -PwithoutMek 可启动真正缺少该依赖的环境，验证可选依赖降级
    if (!project.hasProperty('withoutAe2')) {
        localRuntime files("libs/appliedenergistics2-19.2.19.jar", "libs/guideme-21.1.22.jar")
    }
    if (!project.hasProperty('withoutMek')) {
        localRuntime files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
