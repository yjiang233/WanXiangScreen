plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// JDK17 工具链在本机（中文用户名）fork Gradle worker 会因 argfile 编码问题起不来，
// 所以编译统一用 JDK21（与 1.21.1 分支一致），代码层面用 release=17 保证产物兼容 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
    }
    // 本地依赖仓库：AE2 15.4.12 / Mekanism 10.4 / Flux 7.2 的 1.20.1 jar
    flatDir { dirs 'libs' }
    mavenCentral()
}

// 用户名含非 ASCII 字符时，开发启动早期窗口无法从 Gradle 缓存解析 LWJGL 原生库。
// 这里把 natives jar 里的 DLL 解到纯 ASCII 的 build/natives 并显式指定查找路径。
def nativesDir = layout.buildDirectory.dir("natives")
def prepareNatives = tasks.register("prepareNatives") {
    outputs.dir(nativesDir)
    doLast {
        def out = nativesDir.get().asFile
        out.mkdirs()
        def roots = [
                new File(System.getProperty("user.home"), ".gradle/caches/modules-2/files-2.1/org.lwjgl"),
                new File(System.getProperty("user.home"), ".gradle/caches/neoformruntime/artifacts/org/lwjgl")
        ]
        def count = 0
        roots.each { root ->
            if (!root.isDirectory()) return
            root.eachFileRecurse { File jar ->
                if (!jar.name.endsWith("-natives-windows.jar")) return
                new java.util.zip.ZipFile(jar).withCloseable { zip ->
                    def entries = zip.entries()
                    while (entries.hasMoreElements()) {
                        def entry = entries.nextElement()
                        if (entry.isDirectory() || !entry.name.endsWith(".dll")) continue
                        def name = new File(entry.name).name
                        def flat = new File(out, name)
                        def nested = new File(out, "windows/x64/org/lwjgl/" + name)
                        nested.parentFile.mkdirs()
                        zip.getInputStream(entry).withCloseable { input ->
                            flat.bytes = input.bytes
                        }
                        nested.bytes = flat.bytes
                        count++
                    }
                }
            }
        }
        logger.lifecycle("已准备 ${count} 个 LWJGL 原生库 -> ${out}")
    }
}
tasks.matching { it.name.startsWith("run") }.configureEach { dependsOn prepareNatives }

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            // -PquickPlay=<存档名> 启动后直接进世界，便于自动化验证
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            property 'org.lwjgl.librarypath', nativesDir.get().asFile.absolutePath
            mods { "${mod_id}" { source sourceSets.main } }
        }

        server {
            workingDirectory project.file('run-server')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

// AE2 / Mekanism / Flux 均为可选依赖：编译期需要其 API，运行期由 runClient 加载但 mods.toml 中不强制要求。
// 1.20.1 的发布 jar 是 SRG 映射，必须走 fg.deobf 才能在开发环境编译通过。
dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-${forge_version}"
    implementation fg.deobf("blank:appliedenergistics2-1.20.1-forge:15.4.12")
    // AE2 15 硬依赖 GuideME，开发运行时必须带上
    implementation fg.deobf("blank:guideme-1.20.1:20.1.15")
    implementation fg.deobf("blank:Mekanism-1.20.1:10.4.16.80")
    implementation fg.deobf("blank:FluxNetworks-1.20.1:7.2.0.14")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}

// 网页看板打进 jar：发布出去别人拿到 jar 也能直接开看板
// mods.toml 模板也在这里展开（FG6 没有 NeoForge 的 generateModMetadata 任务）
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            loader_version_range   : loader_version_range,
            minecraft_version_range: minecraft_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    from('src/main/templates/META-INF') {
        into 'META-INF'
        expand replaceProperties
    }
    from('dashboard') {
        into 'dashboard'
        exclude '**/*.map', '**/.DS_Store'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
