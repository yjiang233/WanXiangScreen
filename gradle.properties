org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ---- 环境版本（与 Minecraft 版本强绑定，勿随意改动）----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.265
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment 提供可读的参数名，版本查询：https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---- 模组信息 ----
# 唯一标识，必须全小写，需与主类 @Mod 注解中的值一致
mod_id=wanxiangscreen
mod_name=WanXiangScreen
mod_license=All Rights Reserved
mod_version=1.0.0
# 包名，应与 Java 源码目录一致
mod_group_id=com.wanxiang.screen
mod_authors=Y酱
mod_description=万象屏：以可选依赖方式联动 AE2 等模组的外部数据看板
