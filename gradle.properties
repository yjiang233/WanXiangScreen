org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 6 不支持 configuration cache

# ---- 环境版本（与 Minecraft 版本强绑定，勿随意改动）----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
loader_version_range=[47,)

# ---- 模组信息 ----
# 唯一标识，必须全小写，需与主类 @Mod 注解中的值一致
mod_id=wanxiangscreen
mod_name=WanXiangScreen
mod_license=All Rights Reserved
mod_version=1.0.0
# 包名，应与 Java 源码目录一致
mod_group_id=com.wanxiang.screen
mod_authors=Y酱
mod_description=万象屏：以可选依赖方式联动 AE2 等模组的外部数据看板
